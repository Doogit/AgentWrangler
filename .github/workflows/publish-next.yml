name: publish-next

# Publish an npm PRERELEASE to the `next` dist-tag on every merge to main.
# The `latest` tag is never touched here — it moves only on a GitHub Release (publish.yml).
#
# Uses Trusted Publishing (OIDC): no token secret, provenance is attached automatically.
# Configure Trusted Publishing for THIS workflow filename on npmjs.com (package → Settings →
# Trusted Publisher) — it is keyed by filename, so publish-next.yml needs its own entry
# separate from publish.yml. Until that exists the publish step fails with a 4xx.
# Do NOT pass --provenance manually — it is automatic under Trusted Publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish per merge; a newer push supersedes an in-flight run.
concurrency:
  group: publish-next
  cancel-in-progress: true

jobs:
  publish-next:
    # Never run on forks — OIDC + publish only make sense on the canonical repo.
    if: github.repository == 'Doogit/AgentWrangler'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # setup-node@v6 (NOT v4): v4 exports a default NODE_AUTH_TOKEN (the runner GITHUB_TOKEN)
      # and points npm at $NPM_CONFIG_USERCONFIG ($RUNNER_TEMP/.npmrc), so npm sees auth as
      # "configured but failing" and skips the OIDC exchange entirely → ENEEDAUTH. v6 only
      # exports NODE_AUTH_TOKEN when one is explicitly provided, so registry-url is safe and
      # gives npm the explicit registry directive OIDC needs. Do NOT set NODE_AUTH_TOKEN.
      # Refs: actions/setup-node#1440, #1551; npm/documentation#1960.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Prerelease version: strip any prerelease suffix, bump patch so `next` sorts ABOVE
      # `latest`, append the short SHA for uniqueness (npm rejects re-publishing a version).
      # Set in-job only — the tarball carries it; the tracked package.json is NOT committed.
      - name: Compute prerelease version
        run: |
          BASE="$(node -p "require('./package.json').version.split('-')[0]")"
          NEXTV="$(node -e "const v=process.argv[1].split('.'); v[2]=String(+v[2]+1); console.log(v.join('.'))" "$BASE")"
          PRE="${NEXTV}-next.$(git rev-parse --short HEAD)"
          echo "Publishing prerelease version: $PRE"
          npm pkg set version="$PRE"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs build + test (a red test blocks the publish); --tag next keeps
      # `latest` untouched; publish uses the OIDC credential.
      #
      # npm >= 11.5.1 is REQUIRED for tokenless OIDC Trusted Publishing, but Node 22 ships
      # npm 10.x. The upgrade MUST happen in this same step: a `npm install -g` in an earlier
      # step does not reliably become the npm this step resolves, and the old npm silently
      # skips OIDC → "ENEEDAUTH ... npm login" (npm/cli#9088). The version guard fails loud
      # if the upgrade did not take; the .npmrc echo confirms no _authToken line is blocking
      # the OIDC exchange (actions/setup-node#1551). ENEEDAUTH here means OIDC was NOT
      # attempted (version/.npmrc); a 4xx would mean it was attempted but the npmjs.com
      # Trusted Publisher config (repo/workflow-filename/environment) does not match.
      - name: Publish prerelease to npm (next)
        run: |
          npm install -g npm@latest
          echo "node $(node -v) / npm $(npm -v)"
          node -e "const v=require('child_process').execSync('npm -v').toString().trim();const [x,y]=v.split('.').map(Number);if(x<11||(x===11&&y<5)){console.error('npm '+v+' < 11.5.1 — tokenless OIDC unavailable; publish would fail with ENEEDAUTH');process.exit(1);}"
          echo "--- npm user config (the file npm actually reads: \$NPM_CONFIG_USERCONFIG) ---"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset, npm uses ~/.npmrc>}"
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null || echo '(no user npmrc — good)'
          echo "NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN:+(set — will block OIDC)}"
          # OIDC needs the runner id-token endpoint; absent => org policy blocks id-token
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then echo 'OIDC token endpoint: present'; else echo 'OIDC token endpoint: ABSENT — org/repo Actions policy is suppressing id-token'; fi
          npm publish --tag next

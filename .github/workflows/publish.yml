name: publish

# npm publish via Trusted Publishing (OIDC). No token secret: npm mints a short-lived
# OIDC credential from the id-token below, and provenance is attached automatically.
# Configure Trusted Publishing for this workflow on npmjs.com BEFORE the first release run.
# Do NOT pass --provenance manually — it is automatic under Trusted Publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # OIDC Trusted Publishing requires npm >= 11.5.0; Node 22 ships an older npm.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs build + test; publish uses the OIDC credential.
      - name: Publish to npm
        run: npm publish

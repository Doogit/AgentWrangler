name: publish

# npm publish via Trusted Publishing (OIDC). No token secret: npm mints a short-lived
# OIDC credential from the id-token below, and provenance is attached automatically.
# Configure Trusted Publishing for this workflow on npmjs.com BEFORE the first release run.
# Do NOT pass --provenance manually — it is automatic under Trusted Publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs build + test; publish uses the OIDC credential.
      #
      # npm >= 11.5.1 is REQUIRED for tokenless OIDC Trusted Publishing, but Node 22 ships
      # npm 10.x. The upgrade MUST happen in this same step: a `npm install -g` in an earlier
      # step does not reliably become the npm this step resolves, and the old npm silently
      # skips OIDC → "ENEEDAUTH ... npm login" (npm/cli#9088). The version guard fails loud
      # if the upgrade did not take; the .npmrc echo confirms no _authToken line is blocking
      # the OIDC exchange (actions/setup-node#1551).
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          echo "node $(node -v) / npm $(npm -v)"
          node -e "const v=require('child_process').execSync('npm -v').toString().trim();const [x,y]=v.split('.').map(Number);if(x<11||(x===11&&y<5)){console.error('npm '+v+' < 11.5.1 — tokenless OIDC unavailable; publish would fail with ENEEDAUTH');process.exit(1);}"
          echo '--- ~/.npmrc (must have NO _authToken line for OIDC) ---'
          cat ~/.npmrc 2>/dev/null || echo '(no ~/.npmrc — good)'
          npm publish

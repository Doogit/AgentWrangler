name: publish

# npm publish via Trusted Publishing (OIDC). No token secret: npm mints a short-lived
# OIDC credential from the id-token below, and provenance is attached automatically.
# Do NOT pass --provenance manually — it is automatic under Trusted Publishing.
#
# ONE file, two channels: npm keys a Trusted Publisher by workflow filename and the package
# holds a single connection, so `latest` (GitHub Release) and `next` (every merge to main)
# both publish from this file. The npmjs.com Trusted Publisher must name `publish.yml`.

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "npm dist-tag to publish"
        type: choice
        options: [next, latest]
        default: next

jobs:
  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'latest')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # setup-node writes a placeholder NODE_AUTH_TOKEN when configuring the registry.
      # npm attempts OIDC before token fallback; no npm token secret is needed here.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs build + test; publish uses the OIDC credential.
      #
      # npm >= 11.5.1 is REQUIRED for tokenless OIDC Trusted Publishing, but Node 22 ships
      # npm 10.x. The upgrade MUST happen in this same step: a `npm install -g` in an earlier
      # step does not reliably become the npm this step resolves, and the old npm silently
      # skips OIDC → "ENEEDAUTH ... npm login" (npm/cli#9088). The version guard fails loud
      # if the upgrade did not take; the diagnostics confirm the OIDC preconditions.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          echo "node $(node -v) / npm $(npm -v)"
          node -e "const v=require('child_process').execSync('npm -v').toString().trim();const [x,y]=v.split('.').map(Number);if(x<11||(x===11&&y<5)){console.error('npm '+v+' < 11.5.1 — tokenless OIDC unavailable; publish would fail with ENEEDAUTH');process.exit(1);}"
          echo "--- npm user config (the file npm actually reads: \$NPM_CONFIG_USERCONFIG) ---"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset, npm uses ~/.npmrc>}"
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null || echo '(no user npmrc — good)'
          echo "NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN:+(set; setup-node supplies a placeholder)}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then echo 'OIDC token endpoint: present'; else echo 'OIDC token endpoint: ABSENT — check id-token permissions'; fi
          npm publish --loglevel verbose

  # npm PRERELEASE to the `next` dist-tag on every merge to main. `latest` is never touched
  # here — it moves only on a GitHub Release (the `publish` job above).
  publish-next:
    # Never run on forks — OIDC + publish only make sense on the canonical repo.
    if: github.repository == 'Doogit/AgentWrangler' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'next'))
    # One publish per merge; a newer push supersedes an in-flight run.
    concurrency:
      group: publish-next
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # setup-node writes a placeholder NODE_AUTH_TOKEN when configuring the registry.
      # npm attempts OIDC before token fallback; no npm token secret is needed here.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Prerelease version: strip any prerelease suffix, bump patch so `next` sorts ABOVE
      # `latest`, append the short SHA for uniqueness (npm rejects re-publishing a version).
      # Set in-job only — the tarball carries it; the tracked package.json is NOT committed.
      - name: Compute prerelease version
        run: |
          BASE="$(node -p "require('./package.json').version.split('-')[0]")"
          NEXTV="$(node -e "const v=process.argv[1].split('.'); v[2]=String(+v[2]+1); console.log(v.join('.'))" "$BASE")"
          PRE="${NEXTV}-next.$(git rev-parse --short HEAD)"
          echo "Publishing prerelease version: $PRE"
          npm pkg set version="$PRE"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs build + test (a red test blocks the publish); --tag next keeps
      # `latest` untouched. Same npm >= 11.5.1 OIDC requirement as the `publish` job; verbose
      # logging exposes OIDC exchange failures npm otherwise hides (ENEEDAUTH or E404).
      - name: Publish prerelease to npm (next)
        run: |
          npm install -g npm@latest
          echo "node $(node -v) / npm $(npm -v)"
          node -e "const v=require('child_process').execSync('npm -v').toString().trim();const [x,y]=v.split('.').map(Number);if(x<11||(x===11&&y<5)){console.error('npm '+v+' < 11.5.1 — tokenless OIDC unavailable; publish would fail with ENEEDAUTH');process.exit(1);}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then echo 'OIDC token endpoint: present'; else echo 'OIDC token endpoint: ABSENT — check id-token permissions'; fi
          npm publish --tag next --loglevel verbose

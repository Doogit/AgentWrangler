name: package-smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Exercise exact built tarball in a fresh profile
        run: node scripts/validation/package-smoke.mjs

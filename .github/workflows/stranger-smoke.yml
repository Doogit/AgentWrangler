name: stranger-smoke

# Follows the from-source install path (docs/getting-started.md) verbatim on a machine
# that has never seen the repo, on Linux, macOS, and Windows. Proves the curated tree
# clones-and-runs (OS2 acceptance) and that the daemon binds loopback and serves the
# dashboard. The macOS job additionally seeds a fake Claude Code Keychain entry so the
# darwin credential-read path (NU6) is exercised.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  stranger-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # macOS only: seed a fake Keychain entry under the service NU6 reads,
      # so the darwin `security find-generic-password` path runs during boot scan.
      - name: Seed fake Claude Code Keychain entry (macOS)
        if: runner.os == 'macOS'
        run: |
          security add-generic-password -U \
            -a "$USER" -s "Claude Code-credentials" \
            -w '{"claudeAiOauth":{"accessToken":"fake-smoke-token"}}' \
            "$HOME/Library/Keychains/login.keychain-db" || true

      # From-source install path (docs/getting-started.md), verbatim.
      - name: npm ci
        run: npm ci

      - name: Build the dashboard
        run: npm run build:ui

      - name: Start daemon and poll the dashboard for HTTP 200 (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          AW_NO_OPEN: "1"
        run: |
          npm run daemon &
          DAEMON_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:2929/ > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2929/)
          kill $DAEMON_PID 2>/dev/null || true
          echo "HTTP status: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ]

      - name: Start daemon and poll the dashboard for HTTP 200 (Windows)
        if: runner.os == 'Windows'
        env:
          AW_NO_OPEN: "1"
        shell: pwsh
        run: |
          $daemon = Start-Process npm.cmd -ArgumentList "run","daemon" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $resp = Invoke-WebRequest -Uri http://127.0.0.1:2929/ -UseBasicParsing -ErrorAction Stop
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Daemon did not respond 200"; exit 1 }
          Write-Host "HTTP status: 200"
